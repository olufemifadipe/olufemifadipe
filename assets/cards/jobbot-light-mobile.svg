<svg xmlns="http://www.w3.org/2000/svg" width="440" height="935" viewBox="0 0 440 935" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Job Application Bot</title>
  <desc id="desc">A Python application for job discovery, skills matching, and application tracking. Greenhouse and Lever feeds, SQLite storage, CSV and JSON exports, automated tests, and a local Playwright practice demo. Working CLI; active development; private source.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#D3E3DF" stroke-width=".7"/></pattern>
    <linearGradient id="fade" x1="264" y1="0" x2="440" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#F2F7F6"/><stop offset="1" stop-color="#F2F7F6" stop-opacity=".2"/></linearGradient>
    <clipPath id="clip"><rect width="440" height="935" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="440" height="935" fill="#F2F7F6"/>
    <rect x="264" width="176" height="935" fill="url(#grid)"/>
    <rect x="264" width="176" height="935" fill="url(#fade)"/>
    <rect x="1" y="34" width="3" height="867" rx="1.5" fill="#166C5B"/>
    <text x="30" y="42" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#166C5B" letter-spacing="1.8">CURRENT BUILD</text><text x="30" y="98" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="32" font-weight="700" fill="#122C35" letter-spacing="-.8">Job Application Bot</text><text x="30" y="139" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#506971" >A more manageable job search,</text><text x="30" y="168" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#506971" >built in Python.</text><rect x="30" y="205" width="380" height="131" rx="11" fill="#E8F1EE" stroke="#D3E3DF"/><text x="50" y="240" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#122C35" >Discover</text><text x="390" y="237" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#166C5B" text-anchor="end">01</text><text x="50" y="274" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="19" font-weight="400" fill="#506971" >Greenhouse and Lever listings from</text><text x="50" y="301" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="19" font-weight="400" fill="#506971" >configured employer feeds.</text><rect x="30" y="348" width="380" height="131" rx="11" fill="#E8F1EE" stroke="#D3E3DF"/><text x="50" y="383" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#122C35" >Compare</text><text x="390" y="380" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#166C5B" text-anchor="end">02</text><text x="50" y="417" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="19" font-weight="400" fill="#506971" >Skill matching with location and</text><text x="50" y="444" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="19" font-weight="400" fill="#506971" >eligibility notes for review.</text><rect x="30" y="491" width="380" height="131" rx="11" fill="#E8F1EE" stroke="#D3E3DF"/><text x="50" y="526" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#122C35" >Track</text><text x="390" y="523" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#166C5B" text-anchor="end">03</text><text x="50" y="560" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="19" font-weight="400" fill="#506971" >SQLite history, application</text><text x="50" y="587" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="19" font-weight="400" fill="#506971" >status, and CSV/JSON exports.</text><rect x="30" y="634" width="380" height="131" rx="11" fill="#E8F1EE" stroke="#D3E3DF"/><text x="50" y="669" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#122C35" >Test</text><text x="390" y="666" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#166C5B" text-anchor="end">04</text><text x="50" y="703" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="19" font-weight="400" fill="#506971" >Automated tests and a local</text><text x="50" y="730" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="19" font-weight="400" fill="#506971" >Playwright practice demo.</text><path d="M30 789H410" stroke="#D3E3DF"/><text x="30" y="821" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#166C5B" >Python · REST APIs · SQLite</text><text x="30" y="847" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#166C5B" >Playwright · pytest</text><text x="30" y="881" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#506971" >Working CLI · Active development</text><text x="30" y="905" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#506971" >Private source</text>
    <rect x=".5" y=".5" width="439" height="934" rx="19.5" stroke="#D3E3DF"/>
  </g>
