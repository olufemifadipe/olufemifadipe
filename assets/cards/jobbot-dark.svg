<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Job Application Bot</title>
  <desc id="desc">A Python application for job discovery, skills matching, and application tracking. Greenhouse and Lever feeds, SQLite storage, CSV and JSON exports, automated tests, and a local Playwright practice demo. Working CLI; active development; private source.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#253748" stroke-width=".7"/></pattern>
    <linearGradient id="fade" x1="576" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#0D1724"/><stop offset="1" stop-color="#0D1724" stop-opacity=".2"/></linearGradient>
    <clipPath id="clip"><rect width="960" height="580" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="960" height="580" fill="#0D1724"/>
    <rect x="576" width="384" height="580" fill="url(#grid)"/>
    <rect x="576" width="384" height="580" fill="url(#fade)"/>
    <rect x="1" y="34" width="3" height="512" rx="1.5" fill="#7EE2C2"/>
    <text x="36" y="42" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#7EE2C2" letter-spacing="1.8">CURRENT BUILD</text><text x="36" y="98" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="44" font-weight="700" fill="#F0F6FC" letter-spacing="-.8">Job Application Bot</text><text x="36" y="139" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="24" font-weight="400" fill="#9EACBD" >A more manageable job search, built in Python.</text><rect x="36" y="184" width="432" height="130" rx="11" fill="#121F2E" stroke="#253748"/><text x="56" y="219" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#F0F6FC" >Discover</text><text x="448" y="216" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#7EE2C2" text-anchor="end">01</text><text x="56" y="253" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#9EACBD" >Greenhouse and Lever listings from</text><text x="56" y="280" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#9EACBD" >configured employer feeds.</text><rect x="492" y="184" width="432" height="130" rx="11" fill="#121F2E" stroke="#253748"/><text x="512" y="219" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#F0F6FC" >Compare</text><text x="904" y="216" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#7EE2C2" text-anchor="end">02</text><text x="512" y="253" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#9EACBD" >Skill matching with location and</text><text x="512" y="280" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#9EACBD" >eligibility notes for review.</text><rect x="36" y="330" width="432" height="130" rx="11" fill="#121F2E" stroke="#253748"/><text x="56" y="365" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#F0F6FC" >Track</text><text x="448" y="362" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#7EE2C2" text-anchor="end">03</text><text x="56" y="399" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#9EACBD" >SQLite history, application status,</text><text x="56" y="426" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#9EACBD" >and CSV/JSON exports.</text><rect x="492" y="330" width="432" height="130" rx="11" fill="#121F2E" stroke="#253748"/><text x="512" y="365" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="23" font-weight="600" fill="#F0F6FC" >Test</text><text x="904" y="362" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#7EE2C2" text-anchor="end">04</text><text x="512" y="399" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#9EACBD" >Automated tests and a local</text><text x="512" y="426" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#9EACBD" >Playwright practice demo.</text><path d="M36 484H924" stroke="#253748"/><text x="36" y="516" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#7EE2C2" >Python · REST APIs · SQLite · Playwright · pytest</text><text x="36" y="550" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#9EACBD" >Working CLI · Active development · Private source</text>
