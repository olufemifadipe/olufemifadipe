<svg xmlns="http://www.w3.org/2000/svg" width="440" height="443" viewBox="0 0 440 443" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Nova &amp; my home lab</title>
  <desc id="desc">I&#x27;m also building Nova, a local AI assistant, and running a home lab with dedicated machines for AI workloads, development, and Linux practice. It gives me a place to work with Ollama, SSH, and private networking while learning how to deploy and troubleshoot applications across machines.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#253748" stroke-width=".7"/></pattern>
    <linearGradient id="fade" x1="264" y1="0" x2="440" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#0D1724"/><stop offset="1" stop-color="#0D1724" stop-opacity=".2"/></linearGradient>
    <clipPath id="clip"><rect width="440" height="443" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="440" height="443" fill="#0D1724"/>
    <rect x="264" width="176" height="443" fill="url(#grid)"/>
    <rect x="264" width="176" height="443" fill="url(#fade)"/>
    <rect x="1" y="34" width="3" height="375" rx="1.5" fill="#7EE2C2"/>
    <text x="30" y="42" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="500" fill="#7EE2C2" letter-spacing="1.5">LOCAL AI &amp; LINUX</text><text x="30" y="98" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="32" font-weight="700" fill="#F0F6FC" letter-spacing="-.7">Nova &amp; my home lab</text><text x="30" y="137" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#9EACBD" >I&#x27;m also building Nova, a local</text><text x="30" y="167" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#9EACBD" >AI assistant, and running a home</text><text x="30" y="197" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#9EACBD" >lab with dedicated machines for</text><text x="30" y="227" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#9EACBD" >AI workloads, development, and</text><text x="30" y="257" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#9EACBD" >Linux practice. It gives me a</text><text x="30" y="287" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#9EACBD" >place to work with Ollama, SSH,</text><text x="30" y="317" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#9EACBD" >and private networking while</text><text x="30" y="347" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#9EACBD" >learning how to deploy and</text><text x="30" y="377" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#9EACBD" >troubleshoot applications across</text><text x="30" y="407" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="21" font-weight="400" fill="#9EACBD" >machines.</text>
    <rect x=".5" y=".5" width="439" height="442" rx="19.5" stroke="#253748"/>
  </g>
