    <clipPath id="clip"><rect width="960" height="262" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="960" height="262" fill="#0D1724"/>
    <rect x="576" width="384" height="262" fill="url(#grid)"/>
    <rect x="576" width="384" height="262" fill="url(#fade)"/>
    <rect x="1" y="34" width="3" height="194" rx="1.5" fill="#7EE2C2"/>
    <text x="36" y="42" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#7EE2C2" letter-spacing="1.5">02 / API INTEGRATION</text><text x="36" y="94" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="36" font-weight="700" fill="#F0F6FC" letter-spacing="-.7">Air Quality Explorer</text><text x="36" y="135" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="23" font-weight="400" fill="#9EACBD" >A Python application that retrieves IQAir air quality and weather data,</text><text x="36" y="167" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="23" font-weight="400" fill="#9EACBD" >processes JSON responses, and generates a Folium map.</text><rect x="36" y="195" width="91" height="35" rx="7" fill="#7EE2C2" fill-opacity=".085" stroke="#253748"/><text x="49" y="217" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="500" fill="#7EE2C2" >Python</text><rect x="135" y="195" width="112" height="35" rx="7" fill="#7EE2C2" fill-opacity=".085" stroke="#253748"/><text x="148" y="217" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="500" fill="#7EE2C2" >REST APIs</text><rect x="255" y="195" width="79" height="35" rx="7" fill="#7EE2C2" fill-opacity=".085" stroke="#253748"/><text x="268" y="217" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="500" fill="#7EE2C2" >Folium</text><path d="m909 45 15-15m-15 0h15v15" stroke="#7EE2C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="894" y="42" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="11" font-weight="500" fill="#9EACBD" text-anchor="end" letter-spacing="1.2">VIEW SOURCE</text>
    <rect x=".5" y=".5" width="959" height="261" rx="19.5" stroke="#253748"/>
