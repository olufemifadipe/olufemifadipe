<svg xmlns="http://www.w3.org/2000/svg" width="960" height="262" viewBox="0 0 960 262" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Air Quality Explorer</title>
  <desc id="desc">A Python application that retrieves IQAir air quality and weather data, processes JSON responses, and generates a Folium map. Open repository.</desc>
