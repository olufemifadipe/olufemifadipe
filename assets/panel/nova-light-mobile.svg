  <title id="title">Nova &amp; my home lab. I'm also building Nova, a local AI assistant, and running a home lab with dedicated machines for AI workloads, development, and Linux practice. It gives me a place to work with Ollama, SSH, and private networking while learning how to deploy and troubleshoot applications across machines.</title>
